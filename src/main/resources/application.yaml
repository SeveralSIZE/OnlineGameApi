spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/onlinegame
    username: postgres
    password: 1111
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  application:
    name: OnlineGameApi

management:
  endpoints:
    web:
      exposure:
        include: prometheus
      base-path: /
      path-mapping:
        prometheus: metrics

jwt:
  secret: супер_мега_гипер_ультра_секретный_пароль
  access-token-expiration: 900000         # 15 минут
  refresh-token-expiration: 2592000000    # 30 дней

logging:
  level:
    org.springframework.security: DEBUG