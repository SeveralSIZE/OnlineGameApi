spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  application:
    name: OnlineGameApi

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
      base-path: /
      path-mapping:
        prometheus: metrics

  endpoint:
    prometheus:
      enabled: true

jwt:
  secret: супер_мега_гипер_ультра_секретный_пароль
  access-token-expiration: 900000         # 15 минут
  refresh-token-expiration: 2592000000    # 30 дней

logging:
  file:
    name: /var/log/online-game-server/app.log

  level:
    org.springframework.security: DEBUG
    org.example.onlinegameapi: DEBUG

  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 7
      file-name-pattern: /var/log/myapp/app-%d{yyyy-MM-dd}.%i.log