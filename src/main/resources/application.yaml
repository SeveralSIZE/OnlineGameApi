spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/onlinegame
    username: postgres
    password: 1111
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false
    locations: classpath:migration

  application:
    name: OnlineGameApi

jwt:
  secret: супер_мега_гипер_ультра_секретный_пароль
  access-token-expiration: 900000         # 15 минут
  refresh-token-expiration: 2592000000    # 30 дней