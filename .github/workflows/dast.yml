name: DAST

on: [push, pull_request]

jobs:
  owasp_zap:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Start application
        run: |
          docker compose up -d --build
          sleep 30

      - name: Create ZAP automation plan
        run: |
          mkdir -p .zap
          cat > .zap/af-plan.yaml << 'EOF'
          env:
          contexts:
           - name: "OnlineGameApi"
             urls:
               - "http://localhost:8080"
          jobs:
          - type: openapi
           parameters:
             apiUrl: "http://localhost:8080/v3/api-docs"
             targetUrl: "http://localhost:8080"
          - type: passiveScan-config
           parameters:
             maxAlertsPerRule: 10
          - type: spider
           parameters:
             url: "http://localhost:8080"
             maxDuration: 2
          - type: passiveScan-wait
           parameters:
             maxDuration: 5
          - type: report
           parameters:
             template: "traditional-json"
             reportDir: "/zap/wrk"
             reportFile: "report_json.json"
          - type: report
           parameters:
             template: "traditional-html"
             reportDir: "/zap/wrk"
             reportFile: "report_html.html"
          - type: report
           parameters:
             template: "traditional-md"
             reportDir: "/zap/wrk"
             reportFile: "report_md.md"
          EOF

      - name: Run ZAP with OpenAPI
        run: |
          docker run --network=host \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/.zap/af-plan.yaml

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md

      - name: Stop application
        if: always()
        run: docker compose down