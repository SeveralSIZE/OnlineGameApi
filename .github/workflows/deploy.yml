name: deploy app

env:
  APP_NAME: game-server
  NAMESPACE: prod
  DOCKER_IMAGE: game-server

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - run: mvn clean package -DskipTests

      - run: docker build -t $DOCKER_IMAGE:latest .

      - run: |
          docker save $DOCKER_IMAGE:latest -o /tmp/$APP_NAME.tar
          sudo ctr -n k8s.io images import /tmp/$APP_NAME.tar
          scp /tmp/$APP_NAME.tar vboxuser@k8s-worker1:/tmp/
          scp /tmp/$APP_NAME.tar vboxuser@k8s-worker2:/tmp/
          ssh vboxuser@k8s-worker1 "sudo ctr -n k8s.io images import /tmp/$APP_NAME.tar && rm /tmp/$APP_NAME.tar"
          ssh vboxuser@k8s-worker2 "sudo ctr -n k8s.io images import /tmp/$APP_NAME.tar && rm /tmp/$APP_NAME.tar"
          rm -f /tmp/$APP_NAME.tar

      - run: kubectl rollout restart deployment/$APP_NAME -n $NAMESPACE

      - run: kubectl rollout status deployment/$APP_NAME -n $NAMESPACE --timeout=120s