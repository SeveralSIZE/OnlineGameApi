name: SAST

on: [push, pull_request]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config "p/java" \
                  --config "p/spring" \
                  --config .semgrep/rules.yaml \
                  --error \
                  --json > semgrep-report.json \
                  ./src

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json