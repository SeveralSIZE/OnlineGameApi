services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onlinegame
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlinegame"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onlinegame
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1111
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./OnlineGameClient
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  pgdata: